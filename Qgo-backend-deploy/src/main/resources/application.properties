spring.application.name=Qgo-backend
server.port=${PORT:8080}

# Si hay base de datos PostgreSQL en la nube usa sus credenciales, de lo contrario usa H2 embebido
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/qgodb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true